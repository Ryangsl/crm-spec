openapi: 3.0.3
info:
  title: CRM + Call Center SaaS API
  version: "1.0.0-draft"
  description: >
    Contrato de referência entre crm-frontend e crm-backend. Este arquivo é um
    esqueleto ilustrativo dos endpoints citados em ../01-product/use-cases.md
    e ../02-business/workflows.md — não é a especificação completa e exaustiva
    de todos os módulos, que evolui junto com a implementação. Ver diretrizes
    gerais em api-guidelines.md.
servers:
  - url: https://api.{tenant_domain}/v1
    variables:
      tenant_domain:
        default: exemplo.crm.local

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Autentica um usuário e emite tokens
      description: >
        O access token (TTL 15 min) volta no corpo. O refresh token (TTL 7 dias,
        rotacionado a cada uso) é entregue em cookie httpOnly Secure e nunca
        aparece no corpo da resposta — ver ADR-008 e D-004/D-005.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login bem-sucedido
          headers:
            Set-Cookie:
              description: refresh_token=<opaco>; HttpOnly; Secure; Path=/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      summary: Renova o access token a partir do refresh token do cookie
      description: >
        Lê o refresh token do cookie httpOnly, rotaciona-o (o anterior fica
        marcado como revogado por rotação) e devolve um novo access token.
        Reapresentar um token já rotacionado é reuso comprovado (D-056) e
        revoga TODAS as sessões ativas do usuário, não só a reutilizada — a
        granularidade é por usuário, não por dispositivo (o modelo de dados
        não distingue dispositivo ainda).
      security: []
      responses:
        "200":
          description: Novo access token emitido e refresh token rotacionado
          headers:
            Set-Cookie:
              description: refresh_token=<novo opaco>; HttpOnly; Secure; Path=/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      summary: Encerra a sessão atual (revoga só o refresh token do cookie)
      description: >
        Idempotente — token já inválido/inexistente não é erro. Não exige
        access token válido (funciona com ele já expirado).
      security: []
      responses:
        "204":
          description: Sessão encerrada (cookie limpo)
          headers:
            Set-Cookie:
              description: refresh_token=; Path=/v1/auth; Expires=<epoch> (limpa o cookie)
              schema: { type: string }

  /auth/logout-all:
    post:
      summary: Encerra todas as sessões do usuário (D-057)
      description: >
        Identifica o usuário pelo próprio refresh token do cookie (prova de
        posse via hash — nunca pelo id sozinho) e revoga todos os refresh
        tokens ativos daquele usuário. Não exige access token válido.
      security: []
      responses:
        "204":
          description: Todas as sessões do usuário foram encerradas
          headers:
            Set-Cookie:
              description: refresh_token=; Path=/v1/auth; Expires=<epoch> (limpa o cookie)
              schema: { type: string }

  /users:
    get:
      summary: Lista usuários do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      summary: Cria um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      summary: Retorna o próprio usuário (sempre o do token, nunca outro tenant)
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{id}:
    get:
      summary: Obtém um usuário do tenant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza nome e/ou papéis de um usuário do tenant
      description: >
        Escopo deliberadamente restrito a nome e role_ids — e-mail e senha
        ficam fora de um PATCH genérico. role_ids ausente no corpo não altera
        os papéis atuais; role_ids presente SUBSTITUI o conjunto inteiro.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Desativa um usuário do tenant (não remove o registro)
      description: >
        "Exclusão" de usuário é desativação lógica (status=inactive) —
        distinta do soft delete via deletedAt usado em dados de negócio
        (Cliente/Lead/Oportunidade/Atendimento).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Usuário desativado
        "404":
          $ref: "#/components/responses/NotFound"

  /customers:
    get:
      summary: Lista clientes do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          required: false
          description: Busca livre em name/document/primary_phone/primary_email
          schema: { type: string }
        - name: owner_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista paginada de clientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
    post:
      summary: Cria um cliente
      description: >
        BR-08/D-067 — se document/primary_phone/primary_email já existir em
        outro cliente ativo do tenant, retorna 409 com os candidatos
        encontrados em vez de criar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Cliente duplicado (BR-08/D-067)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerDuplicateError" }

  /customers/{id}:
    get:
      summary: Obtém um cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza um cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Exclui (soft delete) um cliente
      description: >
        D-035/BR-22 — preenche deleted_at, nunca remove fisicamente.
        Requer customers:delete (vendedor/consultora nunca tem essa
        permissão).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cliente excluído (soft delete)
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/{id}/contacts:
    get:
      summary: Lista os contatos do cliente
      description: Sub-recurso de Customer (D-065) — sem paginação própria.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lista de contatos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Cria um contato para o cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreate" }
      responses:
        "201":
          description: Contato criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/{id}/contacts/{contactId}:
    get:
      summary: Obtém um contato do cliente
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Contato encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404":
          description: >
            Cliente ou contato não encontrado, de outro tenant, ou contato
            não pertence ao cliente informado (nunca 403 nesse descasamento).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Atualiza um contato do cliente
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactUpdate" }
      responses:
        "200":
          description: Contato atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Exclui (soft delete) um contato do cliente
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Contato excluído (soft delete)
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/{id}/interactions:
    get:
      summary: Histórico de interações do cliente (cursor — recurso cronológico)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Histórico paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Interaction" }
                  next_cursor: { type: string, nullable: true }

  /leads:
    get:
      summary: Lista leads do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, in_progress, qualified, disqualified, converted]
        - name: owner_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: source_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista paginada de leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadList" }
    post:
      summary: Cria um lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "201":
          description: Lead criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: source_id (ou owner_id, quando informado) não encontrado no tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads/{id}:
    get:
      summary: Obtém um lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lead encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza a origem e/ou o responsável de um lead
      description: >
        Não atualiza status — mudança de estado sempre passa pelos
        endpoints de ação (qualify/disqualify/reopen/convert).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Lead atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Exclui (soft delete) um lead
      description: D-035/BR-22 — preenche deleted_at, nunca remove fisicamente.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Lead excluído (soft delete)
        "404":
          $ref: "#/components/responses/NotFound"

  /leads/{id}/qualify:
    post:
      summary: Qualifica um lead
      description: Válido a partir dos status `new` ou `in_progress`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Lead qualificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "409":
          description: Status atual não permite qualificação (LEAD_INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads/{id}/disqualify:
    post:
      summary: Desqualifica um lead (exige motivo — BR-06)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201":
          description: Lead desqualificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "409":
          description: Status atual não permite desqualificação (LEAD_INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads/{id}/reopen:
    post:
      summary: Reabre um lead desqualificado (D-033/BR-06)
      description: >
        Só é possível a partir do status `disqualified`. Reutiliza o
        mesmo registro (nunca cria um novo lead) — status volta a `new`,
        disqualify_reason é limpo no registro ativo (o motivo anterior
        fica preservado no AuditLog, ação `lead.reopened`).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Lead reaberto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "409":
          description: Lead não está desqualificado (LEAD_INVALID_STATUS_TRANSITION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads/{id}/convert:
    post:
      summary: Converte um lead, vinculando-o a um Cliente (BR-04)
      description: >
        Escopo da Fase 3.4: vincula/cria o Customer (respeitando a
        deduplicação de BR-08/D-067) e marca o lead como `converted`.
        NÃO cria Opportunity nesta fase — fica para a Fase 3.5, que usará
        `leads.id` via `opportunities.lead_id` (campo já existente no
        schema desde a 3.2). Válido a partir dos status `new`,
        `in_progress` ou `qualified`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertLeadRequest" }
      responses:
        "201":
          description: Lead convertido (vinculado ao Customer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: customer_id e customer ausentes ou ambos informados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Lead em estado inválido para conversão
            (LEAD_INVALID_STATUS_TRANSITION) ou cliente duplicado
            (CUSTOMER_DUPLICATE, BR-08/D-067 — ver CustomerDuplicateError)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lead-sources:
    get:
      summary: Lista origens de lead do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de origens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSourceList" }
    post:
      summary: Cria uma origem de lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadSourceCreate" }
      responses:
        "201":
          description: Origem criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSource" }

  /lead-sources/{id}:
    get:
      summary: Obtém uma origem de lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Origem encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSource" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza uma origem de lead
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadSourceUpdate" }
      responses:
        "200":
          description: Origem atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadSource" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Exclui (soft delete) uma origem de lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Origem excluída (soft delete)
        "404":
          $ref: "#/components/responses/NotFound"

  /pipelines/{pipelineId}/opportunities:
    get:
      summary: Lista oportunidades de um pipeline, opcionalmente por etapa
      parameters:
        - name: pipelineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stage_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de oportunidades (offset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }

  /opportunities/{id}/move:
    post:
      summary: Move a oportunidade para outra etapa (BR-09, BR-10)
      description: >
        Movimentação entre etapas é livre, inclusive pulando etapas. `justification` é
        obrigatório quando a movimentação pula uma ou mais etapas (D-032); a obrigatoriedade
        condicional é validada no backend, não expressável neste schema.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage_id]
              properties:
                stage_id: { type: string, format: uuid }
                justification:
                  type: string
                  nullable: true
                  description: Obrigatório quando a movimentação pula uma ou mais etapas (D-032).
      responses:
        "200":
          description: Oportunidade movida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/win:
    post:
      summary: Marca a oportunidade como ganha (estado terminal — BR-11)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Oportunidade ganha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/lose:
    post:
      summary: Marca a oportunidade como perdida (exige motivo — BR-12)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Oportunidade perdida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /calls/click-to-call:
    post:
      summary: "[Fase 5] Origina uma chamada ativa a partir do CRM"
      description: >
        Fora do MVP. Depende da escolha do provedor de telefonia (D-010,
        ADIADO até a Fase 5). Documentado aqui apenas como forma esperada do
        contrato quando a Fase 5 iniciar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, phone]
              properties:
                customer_id: { type: string, format: uuid }
                phone: { type: string }
      responses:
        "202":
          description: Chamada em originação (assíncrona; status via WebSocket/polling)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /calls/{id}/disposition:
    post:
      summary: Registra a disposição de uma chamada encerrada (BR-15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition_id]
              properties:
                disposition_id: { type: string, format: uuid }
      responses:
        "200":
          description: Disposição registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: UUID v7 do último item da página anterior (recursos cronológicos)
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      description: Número da página, base 1 (recursos administrativos)
      schema: { type: integer, default: 1, minimum: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado ou fora do escopo do tenant/usuário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }

    AccessToken:
      type: object
      description: >
        O refresh token não aparece aqui — ele trafega exclusivamente em cookie
        httpOnly (ADR-008 / D-005).
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }

    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        role_ids:
          type: array
          items: { type: string, format: uuid }

    UserUpdate:
      type: object
      description: >
        Nenhum campo obrigatório — envie só o que quer mudar. role_ids
        ausente = não mexe nos papéis; role_ids presente = substitui o
        conjunto inteiro (mesmo `[]`, que remove todos os papéis).
      properties:
        name: { type: string }
        role_ids:
          type: array
          items: { type: string, format: uuid }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }

    UserList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    CustomerCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), apenas números.
        primary_phone: { type: string, description: "Formato E.164, ex.: +5511999999999" }
        primary_email: { type: string, format: email }
        owner_id:
          type: string
          format: uuid
          description: Responsável pelo cliente; padrão — usuário autenticado.
        tags: { type: array, items: { type: string } }
        custom_fields: { type: object }

    CustomerUpdate:
      type: object
      description: >
        Nenhum campo obrigatório (PATCH parcial). Ausente = não mexe;
        `null` explícito limpa document/primary_phone/primary_email/owner_id/
        custom_fields.
      properties:
        name: { type: string }
        document: { type: string, nullable: true }
        primary_phone: { type: string, nullable: true }
        primary_email: { type: string, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        tags: { type: array, items: { type: string } }
        custom_fields: { type: object, nullable: true }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        document: { type: string, nullable: true }
        primary_phone: { type: string, nullable: true }
        primary_email: { type: string, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        tags: { type: array, items: { type: string } }
        custom_fields: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    CustomerDuplicateCandidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        document: { type: string, nullable: true }
        primary_phone: { type: string, nullable: true }
        primary_email: { type: string, nullable: true }

    CustomerDuplicateError:
      description: >
        BR-08/D-067 — documento, telefone ou e-mail já existe em outro
        cliente ativo do tenant. Nunca cria automaticamente; a aplicação
        nunca escolhe entre candidatos.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            candidates:
              type: array
              items: { $ref: "#/components/schemas/CustomerDuplicateCandidate" }

    ContactCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        role: { type: string, description: "Cargo/relação com o cliente" }

    ContactUpdate:
      type: object
      description: Nenhum campo obrigatório (PATCH parcial). Ausente = não mexe.
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, nullable: true }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeadCreate:
      type: object
      required: [source_id]
      properties:
        source_id: { type: string, format: uuid, description: "BR-03: origem obrigatoria" }
        owner_id:
          type: string
          format: uuid
          description: >
            Atribuicao manual do responsavel. Se omitido, o round-robin
            (D-068/BR-05) escolhe automaticamente e pode resultar em
            owner_id null quando nao ha vendedor elegivel (D-069).
      description: >
        customer_id nao faz parte do contrato de criacao — so e preenchido
        via POST /leads/{id}/convert (BR-04/D-065).

    LeadUpdate:
      type: object
      description: >
        PATCH parcial (origem, reatribuicao manual). Mudanca de status
        nunca passa por aqui — sempre pelos endpoints de acao dedicados
        (qualify/disqualify/reopen/convert).
      properties:
        source_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, nullable: true }

    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [new, in_progress, qualified, disqualified, converted]
        source_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        disqualify_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeadList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Lead" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    ConvertLeadRequest:
      type: object
      description: >
        BR-04 — vincula o lead a um Cliente (novo ou existente, resolvido
        por deduplicacao — BR-08/D-067). Exatamente um dos dois campos
        deve ser informado.
      properties:
        customer_id:
          type: string
          format: uuid
          description: Vincula a um cliente ja existente no tenant.
        customer:
          $ref: "#/components/schemas/CustomerCreate"
          description: Cria um novo cliente (mesma validacao/dedup de POST /v1/customers).

    LeadSourceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }

    LeadSourceUpdate:
      type: object
      properties:
        name: { type: string }

    LeadSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeadSourceList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/LeadSource" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        pipeline_id: { type: string, format: uuid }
        stage_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        value: { type: number, nullable: true }
        status: { type: string, enum: [open, won, lost] }
        lost_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Call:
      type: object
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        status: { type: string, enum: [ringing, answered, missed, failed] }
        customer_id: { type: string, format: uuid, nullable: true }
        agent_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time }

    Interaction:
      type: object
      description: Item de histórico unificado (chamada, mensagem ou nota) do cliente
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [call, message, note] }
        occurred_at: { type: string, format: date-time }
        summary: { type: string }
