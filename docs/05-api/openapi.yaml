openapi: 3.0.3
info:
  title: CRM + Call Center SaaS API
  version: "1.0.0-draft"
  description: >
    Contrato de referência entre crm-frontend e crm-backend. Este arquivo é um
    esqueleto ilustrativo dos endpoints citados em ../01-product/use-cases.md
    e ../02-business/workflows.md — não é a especificação completa e exaustiva
    de todos os módulos, que evolui junto com a implementação. Ver diretrizes
    gerais em api-guidelines.md.
servers:
  - url: https://api.{tenant_domain}/v1
    variables:
      tenant_domain:
        default: exemplo.crm.local

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Autentica um usuário e emite tokens
      description: >
        O access token (TTL 15 min) volta no corpo. O refresh token (TTL 7 dias,
        rotacionado a cada uso) é entregue em cookie httpOnly Secure e nunca
        aparece no corpo da resposta — ver ADR-008 e D-004/D-005.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login bem-sucedido
          headers:
            Set-Cookie:
              description: refresh_token=<opaco>; HttpOnly; Secure; Path=/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      summary: Renova o access token a partir do refresh token do cookie
      description: >
        Lê o refresh token do cookie httpOnly, rotaciona-o (o anterior fica
        marcado como revogado por rotação) e devolve um novo access token.
        Reapresentar um token já rotacionado é reuso comprovado (D-056) e
        revoga TODAS as sessões ativas do usuário, não só a reutilizada — a
        granularidade é por usuário, não por dispositivo (o modelo de dados
        não distingue dispositivo ainda).
      security: []
      responses:
        "200":
          description: Novo access token emitido e refresh token rotacionado
          headers:
            Set-Cookie:
              description: refresh_token=<novo opaco>; HttpOnly; Secure; Path=/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      summary: Encerra a sessão atual (revoga só o refresh token do cookie)
      description: >
        Idempotente — token já inválido/inexistente não é erro. Não exige
        access token válido (funciona com ele já expirado).
      security: []
      responses:
        "204":
          description: Sessão encerrada (cookie limpo)
          headers:
            Set-Cookie:
              description: refresh_token=; Path=/v1/auth; Expires=<epoch> (limpa o cookie)
              schema: { type: string }

  /auth/logout-all:
    post:
      summary: Encerra todas as sessões do usuário (D-057)
      description: >
        Identifica o usuário pelo próprio refresh token do cookie (prova de
        posse via hash — nunca pelo id sozinho) e revoga todos os refresh
        tokens ativos daquele usuário. Não exige access token válido.
      security: []
      responses:
        "204":
          description: Todas as sessões do usuário foram encerradas
          headers:
            Set-Cookie:
              description: refresh_token=; Path=/v1/auth; Expires=<epoch> (limpa o cookie)
              schema: { type: string }

  /users:
    get:
      summary: Lista usuários do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      summary: Cria um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      summary: Retorna o próprio usuário (sempre o do token, nunca outro tenant)
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{id}:
    get:
      summary: Obtém um usuário do tenant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atualiza nome e/ou papéis de um usuário do tenant
      description: >
        Escopo deliberadamente restrito a nome e role_ids — e-mail e senha
        ficam fora de um PATCH genérico. role_ids ausente no corpo não altera
        os papéis atuais; role_ids presente SUBSTITUI o conjunto inteiro.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Desativa um usuário do tenant (não remove o registro)
      description: >
        "Exclusão" de usuário é desativação lógica (status=inactive) —
        distinta do soft delete via deletedAt usado em dados de negócio
        (Cliente/Lead/Oportunidade/Atendimento).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Usuário desativado
        "404":
          $ref: "#/components/responses/NotFound"

  /customers:
    get:
      summary: Lista clientes do tenant (paginação por offset)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
    post:
      summary: Cria um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      summary: Obtém um cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/{id}/interactions:
    get:
      summary: Histórico de interações do cliente (cursor — recurso cronológico)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Histórico paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Interaction" }
                  next_cursor: { type: string, nullable: true }

  /leads:
    post:
      summary: Cria um lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "201":
          description: Lead criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/qualify:
    post:
      summary: Qualifica um lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lead qualificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/disqualify:
    post:
      summary: Desqualifica um lead (exige motivo — BR-06)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Lead desqualificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/convert:
    post:
      summary: Converte um lead qualificado em oportunidade (BR-04)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Oportunidade criada a partir do lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "409":
          description: Lead já convertido ou em estado inválido para conversão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipelines/{pipelineId}/opportunities:
    get:
      summary: Lista oportunidades de um pipeline, opcionalmente por etapa
      parameters:
        - name: pipelineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stage_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de oportunidades (offset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }

  /opportunities/{id}/move:
    post:
      summary: Move a oportunidade para outra etapa (BR-09, BR-10)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage_id]
              properties:
                stage_id: { type: string, format: uuid }
      responses:
        "200":
          description: Oportunidade movida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/win:
    post:
      summary: Marca a oportunidade como ganha (estado terminal — BR-11)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Oportunidade ganha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/lose:
    post:
      summary: Marca a oportunidade como perdida (exige motivo — BR-12)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Oportunidade perdida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /calls/click-to-call:
    post:
      summary: "[Fase 5] Origina uma chamada ativa a partir do CRM"
      description: >
        Fora do MVP. Depende da escolha do provedor de telefonia (D-010,
        ADIADO até a Fase 5). Documentado aqui apenas como forma esperada do
        contrato quando a Fase 5 iniciar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, phone]
              properties:
                customer_id: { type: string, format: uuid }
                phone: { type: string }
      responses:
        "202":
          description: Chamada em originação (assíncrona; status via WebSocket/polling)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /calls/{id}/disposition:
    post:
      summary: Registra a disposição de uma chamada encerrada (BR-15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition_id]
              properties:
                disposition_id: { type: string, format: uuid }
      responses:
        "200":
          description: Disposição registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: UUID v7 do último item da página anterior (recursos cronológicos)
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      description: Número da página, base 1 (recursos administrativos)
      schema: { type: integer, default: 1, minimum: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado ou fora do escopo do tenant/usuário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }

    AccessToken:
      type: object
      description: >
        O refresh token não aparece aqui — ele trafega exclusivamente em cookie
        httpOnly (ADR-008 / D-005).
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }

    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        role_ids:
          type: array
          items: { type: string, format: uuid }

    UserUpdate:
      type: object
      description: >
        Nenhum campo obrigatório — envie só o que quer mudar. role_ids
        ausente = não mexe nos papéis; role_ids presente = substitui o
        conjunto inteiro (mesmo `[]`, que remove todos os papéis).
      properties:
        name: { type: string }
        role_ids:
          type: array
          items: { type: string, format: uuid }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }

    UserList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    CustomerCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        document: { type: string }
        primary_phone: { type: string }
        primary_email: { type: string, format: email }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        document: { type: string, nullable: true }
        primary_phone: { type: string, nullable: true }
        primary_email: { type: string, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    LeadCreate:
      type: object
      required: [source_id]
      properties:
        source_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }

    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [new, in_progress, qualified, disqualified, converted]
        source_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        pipeline_id: { type: string, format: uuid }
        stage_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        value: { type: number, nullable: true }
        status: { type: string, enum: [open, won, lost] }
        lost_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Call:
      type: object
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        status: { type: string, enum: [ringing, answered, missed, failed] }
        customer_id: { type: string, format: uuid, nullable: true }
        agent_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time }

    Interaction:
      type: object
      description: Item de histórico unificado (chamada, mensagem ou nota) do cliente
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [call, message, note] }
        occurred_at: { type: string, format: date-time }
        summary: { type: string }
